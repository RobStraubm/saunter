name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python-Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  app:
    name: App bauen
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift build -c release
        working-directory: SaunterApp
